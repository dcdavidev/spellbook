packages:
  - 'packages/*'

allowBuilds:
  lefthook: true
catalog:
  '@commitlint/cli': ^21.2.4
  '@commitlint/config-conventional': ^21.2.4
  '@commitlint/types': ^21.2.3
  '@cspell/cspell-types': ^10.5.2
  '@eslint-react/eslint-plugin': ^5.30.6
  '@eslint/css': ^2.0.1
  '@eslint/js': ^10.0.1
  '@eslint/json': ^2.1.1
  '@eslint/markdown': ^9.0.0
  '@eslint/shell': ^0.1.2
  '@next/eslint-plugin-next': ^16.4.6
  '@prettier/plugin-xml': ^3.4.2
  '@types/node': ^26.6.11
  '@typescript/native': npm:typescript@7.1.0-beta
  cspell: ^10.5.2
  eslint: ^10.15.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-jsdoc: ^65.5.7
  eslint-plugin-node-dependencies: ^2.3.0
  eslint-plugin-prettier: ^5.5.7
  eslint-plugin-simple-import-sort: ^14.0.0
  eslint-plugin-unicorn: ^80.0.0
  globals: ^17.14.0
  jiti: ^2.7.0
  prettier: 3.9.6
  prettier-plugin-packagejson: ^3.1.0
  prettier-plugin-sh: ^0.20.2
  prettier-plugin-toml: ^4.1.0
  turbo: ^2.11.13
  typescript: npm:@typescript/typescript6@^6.0.2
  typescript-eslint: ^8.74.0

publicHoistPattern:
  - '*prettier-plugin-*'
  - '@prettier/plugin-*'
